[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnonic-language-mvp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==1.26.4", "torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
